# Netlify build configuration for Piano Compass.
#
# The site is static HTML. This build step runs a small Node generator
# (build/generate.mjs) that turns the files under content/ into
# indexable HTML section pages (Insights, Videos, New & Interesting
# Instruments) and fills the dynamic blocks on the homepage. Content is
# edited through the CMS at /admin, which commits to content/ and
# triggers this build.

[build]
  command = "npm run build"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Pretty URL for the CMS.
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# Decap CMS OAuth (used when the site is configured with the GitHub
# backend via Netlify's OAuth provider). Harmless if Git Gateway/Identity
# is used instead.
[[redirects]]
  from = "/callback"
  to = "/admin/"
  status = 200
