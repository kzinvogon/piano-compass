  # ── Pianos (the library the finder and sections draw from) ──
  - name: pianos
    label: Pianos
    label_singular: Piano
    folder: content/pianos
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}} — {{constructor}} {{year}}'
    fields:
      - { name: title, label: Title, widget: string }
      - name: constructor
        label: Constructor / maker
        widget: select
        options: [Feurich, Bösendorfer, 'Steinway & Sons', Yamaha, Kawai, Blüthner, 'C. Bechstein', Fazioli, Schimmel, Grotrian, 'Shigeru Kawai', 'August Förster', Ehrbar, 'H. Rachse', 'W. Hoffmann', Other]
      - { name: year, label: Year of build, widget: number, value_type: int, required: false }
      - { name: type, label: Type, widget: select, options: [Grand, 'Baby Grand', Upright, Digital, Other] }
      - { name: category, label: Category, widget: select, options: [New, Used, Restored, 'Pre-owned'] }
      - { name: model, label: Model name (e.g. 123 Vienna), widget: string }
      - { name: size, label: Size (e.g. 123 cm), widget: string }
      - { name: self_playing, label: Self-playing capable, widget: boolean, default: false }
      - name: fits_who
        label: 'Finder — suits which players'
        widget: select
        multiple: true
        required: false
        options: [beginner, hobby, advanced, venue]
      - name: fits_space
        label: 'Finder — suits which spaces'
        widget: select
        multiple: true
        required: false
        options: [apartment, livingroom, large, public]
      - name: priority
        label: 'Finder — strengths'
        widget: select
        multiple: true
        required: false
        options: [value, tone, design, longevity]
      - { name: section, label: Section, widget: hidden, default: instruments }
      - { name: featured, label: Feature as Piano of the Week candidate, widget: boolean, default: false }
      - { name: price, label: Price / guide (e.g. €38,000 or On request), widget: string }
      - { name: image, label: Main photo, widget: image, required: false }
      - name: gallery
        label: More photos
        widget: list
        required: false
        field: { name: photo, label: Photo, widget: image }
      - { name: excerpt, label: Short summary (shown on cards), widget: text }
      - { name: date, label: Date, widget: datetime, required: false }
      - { name: body, label: Full description, widget: markdown, required: false }

  # ── Insights / Advice ──
  - name: insights
    label: Insights & Advice
    label_singular: Article
    folder: content/insights
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, required: false }
      - { name: author, label: Author, widget: string, default: Stuart Conaghan, required: false }
      - { name: image, label: Header image, widget: image, required: false }
      - { name: excerpt, label: Excerpt (shown on cards), widget: text }
      - { name: body, label: Body, widget: markdown, required: false }

  # ── Videos (Cloudinary upload, or YouTube / Vimeo link) ──
  - name: videos
    label: Videos
    label_singular: Video
    folder: content/videos
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    fields:
      - { name: title, label: Title, widget: string }
      - { name: youtube, label: 'YouTube link (best for long videos — paste the full URL)', widget: string }
      - { name: vimeo, label: '…or a Vimeo link (paste the full URL)', widget: string }
      - { name: video_file, label: '…or pick / upload a video (Cloudinary — no size limit)', widget: file, required: false }
      - { name: video_url, label: '…or paste a direct link to a video file', widget: string }
      - { name: poster, label: Thumbnail image (optional, shown before play), widget: image, required: false }
      - { name: date, label: Date, widget: datetime, required: false }
      - { name: description, label: Description, widget: text }

  # ── Social links + Piano of the Week ──
  - name: settings
    label: Settings
    files:
      - name: social
        label: Social & Piano of the Week
        file: content/settings/social.json
        format: json
        fields:
          - { name: instagram_url, label: Instagram URL, widget: string }
          - { name: tiktok_url, label: TikTok URL, widget: string }
          - { name: youtube_url, label: YouTube URL, widget: string }
          - { name: facebook_url, label: Facebook URL, widget: string }
          - { name: piano_of_the_week, label: 'Piano of the Week — file name without .md (e.g. feurich-vienna-123)', widget: string }
